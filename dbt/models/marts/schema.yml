version: 2

models:
  - name: book_popularity
    description: "Per-book loan count, unique borrowers, total days borrowed, last loan date."
    columns:
      - name: book_id
        tests: [unique, not_null]

  - name: member_activity
    description: "Per-member loan count, open loans, average loan duration, last loan date."
    columns:
      - name: member_id
        tests: [unique, not_null]
