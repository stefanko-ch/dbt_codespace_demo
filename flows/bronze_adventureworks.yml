id: bronze_adventureworks
namespace: workshop
description: |
  Solution-branch version: full bronze ingest of all 9 AdventureWorks
  source tables from Azure SQL into the local Postgres `analytics.raw`
  schema. The `main` branch carries the teaching variant that only
  loads `Sales.Customer` -- switch back to `main` to compare.

  Pattern per table (same as the worked example):
    1. prepare_schema       -- one big DDL block: CREATE SCHEMA + CREATE TABLE
                               IF NOT EXISTS for every bronze table, then
                               TRUNCATE so each run is a clean reload.
    2. query_source_<tbl>   -- SELECT from Azure SQL, store result as ION.
    3. insert_into_<tbl>    -- Postgres.Batch streams the ION into Postgres
                               via positional parameterized INSERT.

  Tables loaded:
    - Sales.Customer            -> raw.customer
    - Sales.SalesOrderHeader    -> raw.sales_order_header
    - Sales.SalesOrderDetail    -> raw.sales_order_detail
    - Person.Person             -> raw.person          (xml columns dropped)
    - Sales.SalesTerritory      -> raw.sales_territory (Group -> group_name)
    - Sales.SalesPerson         -> raw.sales_person
    - Production.Product        -> raw.product
    - Production.ProductSubcategory -> raw.product_subcategory
    - Production.ProductCategory    -> raw.product_category

  `rowguid` columns are intentionally excluded -- not useful for analytics.

inputs:
  - id: azure_sql_host
    type: STRING
    defaults: nonacomp-sql.database.windows.net
  - id: azure_sql_database
    type: STRING
    defaults: AdventureWorks
  - id: azure_sql_user
    type: STRING
    defaults: bia21
  - id: azure_sql_password
    type: STRING
    defaults: this_is_a_very_UNSECURE_Password_123!

variables:
  target_url: "jdbc:postgresql://postgres:5432/analytics"

tasks:
  # ---------------------------------------------------------------------------
  # Step 1: ensure schema + every bronze table exists, then truncate so each
  # run is a clean reload. Idempotent.
  # ---------------------------------------------------------------------------
  - id: prepare_schema
    type: io.kestra.plugin.jdbc.postgresql.Queries
    url: "{{ vars.target_url }}"
    username: postgres
    password: postgres
    sql: |
      CREATE SCHEMA IF NOT EXISTS raw;

      CREATE TABLE IF NOT EXISTS raw.customer (
        customer_id    INTEGER PRIMARY KEY,
        person_id      INTEGER,
        store_id       INTEGER,
        territory_id   INTEGER,
        account_number TEXT,
        modified_date  TIMESTAMP
      );

      CREATE TABLE IF NOT EXISTS raw.sales_order_header (
        sales_order_id            INTEGER PRIMARY KEY,
        revision_number           SMALLINT,
        order_date                TIMESTAMP,
        due_date                  TIMESTAMP,
        ship_date                 TIMESTAMP,
        status                    SMALLINT,
        online_order_flag         BOOLEAN,
        sales_order_number        TEXT,
        purchase_order_number     TEXT,
        account_number            TEXT,
        customer_id               INTEGER,
        sales_person_id           INTEGER,
        territory_id              INTEGER,
        bill_to_address_id        INTEGER,
        ship_to_address_id        INTEGER,
        ship_method_id            INTEGER,
        credit_card_id            INTEGER,
        credit_card_approval_code TEXT,
        currency_rate_id          INTEGER,
        sub_total                 NUMERIC(19,4),
        tax_amt                   NUMERIC(19,4),
        freight                   NUMERIC(19,4),
        total_due                 NUMERIC(19,4),
        comment                   TEXT,
        modified_date             TIMESTAMP
      );

      CREATE TABLE IF NOT EXISTS raw.sales_order_detail (
        sales_order_id          INTEGER,
        sales_order_detail_id   INTEGER,
        carrier_tracking_number TEXT,
        order_qty               SMALLINT,
        product_id              INTEGER,
        special_offer_id        INTEGER,
        unit_price              NUMERIC(19,4),
        unit_price_discount     NUMERIC(19,4),
        line_total              NUMERIC(38,6),
        modified_date           TIMESTAMP,
        PRIMARY KEY (sales_order_id, sales_order_detail_id)
      );

      CREATE TABLE IF NOT EXISTS raw.person (
        business_entity_id INTEGER PRIMARY KEY,
        person_type        TEXT,
        name_style         BOOLEAN,
        title              TEXT,
        first_name         TEXT,
        middle_name        TEXT,
        last_name          TEXT,
        suffix             TEXT,
        email_promotion    INTEGER,
        modified_date      TIMESTAMP
      );

      CREATE TABLE IF NOT EXISTS raw.sales_territory (
        territory_id        INTEGER PRIMARY KEY,
        name                TEXT,
        country_region_code TEXT,
        group_name          TEXT,
        sales_ytd           NUMERIC(19,4),
        sales_last_year     NUMERIC(19,4),
        cost_ytd            NUMERIC(19,4),
        cost_last_year      NUMERIC(19,4),
        modified_date       TIMESTAMP
      );

      CREATE TABLE IF NOT EXISTS raw.sales_person (
        business_entity_id INTEGER PRIMARY KEY,
        territory_id       INTEGER,
        sales_quota        NUMERIC(19,4),
        bonus              NUMERIC(19,4),
        commission_pct     NUMERIC(10,4),
        sales_ytd          NUMERIC(19,4),
        sales_last_year    NUMERIC(19,4),
        modified_date      TIMESTAMP
      );

      CREATE TABLE IF NOT EXISTS raw.product (
        product_id               INTEGER PRIMARY KEY,
        name                     TEXT,
        product_number           TEXT,
        make_flag                BOOLEAN,
        finished_goods_flag      BOOLEAN,
        color                    TEXT,
        safety_stock_level       SMALLINT,
        reorder_point            SMALLINT,
        standard_cost            NUMERIC(19,4),
        list_price               NUMERIC(19,4),
        size                     TEXT,
        size_unit_measure_code   TEXT,
        weight_unit_measure_code TEXT,
        weight                   NUMERIC(8,2),
        days_to_manufacture      INTEGER,
        product_line             TEXT,
        class                    TEXT,
        style                    TEXT,
        product_subcategory_id   INTEGER,
        product_model_id         INTEGER,
        sell_start_date          TIMESTAMP,
        sell_end_date            TIMESTAMP,
        discontinued_date        TIMESTAMP,
        modified_date            TIMESTAMP
      );

      CREATE TABLE IF NOT EXISTS raw.product_subcategory (
        product_subcategory_id INTEGER PRIMARY KEY,
        product_category_id    INTEGER,
        name                   TEXT,
        modified_date          TIMESTAMP
      );

      CREATE TABLE IF NOT EXISTS raw.product_category (
        product_category_id INTEGER PRIMARY KEY,
        name                TEXT,
        modified_date       TIMESTAMP
      );

      TRUNCATE raw.customer;
      TRUNCATE raw.sales_order_header;
      TRUNCATE raw.sales_order_detail;
      TRUNCATE raw.person;
      TRUNCATE raw.sales_territory;
      TRUNCATE raw.sales_person;
      TRUNCATE raw.product;
      TRUNCATE raw.product_subcategory;
      TRUNCATE raw.product_category;

  # ---------------------------------------------------------------------------
  # Sales.Customer -> raw.customer
  # ---------------------------------------------------------------------------
  - id: query_source_customer
    type: io.kestra.plugin.jdbc.sqlserver.Query
    url: "jdbc:sqlserver://{{ inputs.azure_sql_host }}:1433;databaseName={{ inputs.azure_sql_database }};encrypt=true;trustServerCertificate=true;loginTimeout=30"
    username: "{{ inputs.azure_sql_user }}"
    password: "{{ inputs.azure_sql_password }}"
    fetchType: STORE
    sql: |
      SELECT CustomerID, PersonID, StoreID, TerritoryID, AccountNumber, ModifiedDate
      FROM Sales.Customer

  - id: insert_into_customer
    type: io.kestra.plugin.jdbc.postgresql.Batch
    url: "{{ vars.target_url }}"
    username: postgres
    password: postgres
    from: "{{ outputs.query_source_customer.uri }}"
    sql: |
      INSERT INTO raw.customer (
        customer_id, person_id, store_id, territory_id, account_number, modified_date
      ) VALUES (?, ?, ?, ?, ?, ?)

  # ---------------------------------------------------------------------------
  # Sales.SalesOrderHeader -> raw.sales_order_header
  # ---------------------------------------------------------------------------
  - id: query_source_sales_order_header
    type: io.kestra.plugin.jdbc.sqlserver.Query
    url: "jdbc:sqlserver://{{ inputs.azure_sql_host }}:1433;databaseName={{ inputs.azure_sql_database }};encrypt=true;trustServerCertificate=true;loginTimeout=30"
    username: "{{ inputs.azure_sql_user }}"
    password: "{{ inputs.azure_sql_password }}"
    fetchType: STORE
    sql: |
      SELECT SalesOrderID, RevisionNumber, OrderDate, DueDate, ShipDate, Status,
             OnlineOrderFlag, SalesOrderNumber, PurchaseOrderNumber, AccountNumber,
             CustomerID, SalesPersonID, TerritoryID, BillToAddressID, ShipToAddressID,
             ShipMethodID, CreditCardID, CreditCardApprovalCode, CurrencyRateID,
             SubTotal, TaxAmt, Freight, TotalDue, Comment, ModifiedDate
      FROM Sales.SalesOrderHeader

  - id: insert_into_sales_order_header
    type: io.kestra.plugin.jdbc.postgresql.Batch
    url: "{{ vars.target_url }}"
    username: postgres
    password: postgres
    from: "{{ outputs.query_source_sales_order_header.uri }}"
    sql: |
      INSERT INTO raw.sales_order_header (
        sales_order_id, revision_number, order_date, due_date, ship_date, status,
        online_order_flag, sales_order_number, purchase_order_number, account_number,
        customer_id, sales_person_id, territory_id, bill_to_address_id, ship_to_address_id,
        ship_method_id, credit_card_id, credit_card_approval_code, currency_rate_id,
        sub_total, tax_amt, freight, total_due, comment, modified_date
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

  # ---------------------------------------------------------------------------
  # Sales.SalesOrderDetail -> raw.sales_order_detail
  # ---------------------------------------------------------------------------
  - id: query_source_sales_order_detail
    type: io.kestra.plugin.jdbc.sqlserver.Query
    url: "jdbc:sqlserver://{{ inputs.azure_sql_host }}:1433;databaseName={{ inputs.azure_sql_database }};encrypt=true;trustServerCertificate=true;loginTimeout=30"
    username: "{{ inputs.azure_sql_user }}"
    password: "{{ inputs.azure_sql_password }}"
    fetchType: STORE
    sql: |
      SELECT SalesOrderID, SalesOrderDetailID, CarrierTrackingNumber, OrderQty,
             ProductID, SpecialOfferID, UnitPrice, UnitPriceDiscount, LineTotal,
             ModifiedDate
      FROM Sales.SalesOrderDetail

  - id: insert_into_sales_order_detail
    type: io.kestra.plugin.jdbc.postgresql.Batch
    url: "{{ vars.target_url }}"
    username: postgres
    password: postgres
    from: "{{ outputs.query_source_sales_order_detail.uri }}"
    sql: |
      INSERT INTO raw.sales_order_detail (
        sales_order_id, sales_order_detail_id, carrier_tracking_number, order_qty,
        product_id, special_offer_id, unit_price, unit_price_discount, line_total,
        modified_date
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

  # ---------------------------------------------------------------------------
  # Person.Person -> raw.person  (xml columns AdditionalContactInfo + Demographics dropped)
  # ---------------------------------------------------------------------------
  - id: query_source_person
    type: io.kestra.plugin.jdbc.sqlserver.Query
    url: "jdbc:sqlserver://{{ inputs.azure_sql_host }}:1433;databaseName={{ inputs.azure_sql_database }};encrypt=true;trustServerCertificate=true;loginTimeout=30"
    username: "{{ inputs.azure_sql_user }}"
    password: "{{ inputs.azure_sql_password }}"
    fetchType: STORE
    sql: |
      SELECT BusinessEntityID, PersonType, NameStyle, Title, FirstName, MiddleName,
             LastName, Suffix, EmailPromotion, ModifiedDate
      FROM Person.Person

  - id: insert_into_person
    type: io.kestra.plugin.jdbc.postgresql.Batch
    url: "{{ vars.target_url }}"
    username: postgres
    password: postgres
    from: "{{ outputs.query_source_person.uri }}"
    sql: |
      INSERT INTO raw.person (
        business_entity_id, person_type, name_style, title, first_name, middle_name,
        last_name, suffix, email_promotion, modified_date
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

  # ---------------------------------------------------------------------------
  # Sales.SalesTerritory -> raw.sales_territory  ([Group] aliased to group_name)
  # ---------------------------------------------------------------------------
  - id: query_source_sales_territory
    type: io.kestra.plugin.jdbc.sqlserver.Query
    url: "jdbc:sqlserver://{{ inputs.azure_sql_host }}:1433;databaseName={{ inputs.azure_sql_database }};encrypt=true;trustServerCertificate=true;loginTimeout=30"
    username: "{{ inputs.azure_sql_user }}"
    password: "{{ inputs.azure_sql_password }}"
    fetchType: STORE
    sql: |
      SELECT TerritoryID, Name, CountryRegionCode, [Group] AS GroupName,
             SalesYTD, SalesLastYear, CostYTD, CostLastYear, ModifiedDate
      FROM Sales.SalesTerritory

  - id: insert_into_sales_territory
    type: io.kestra.plugin.jdbc.postgresql.Batch
    url: "{{ vars.target_url }}"
    username: postgres
    password: postgres
    from: "{{ outputs.query_source_sales_territory.uri }}"
    sql: |
      INSERT INTO raw.sales_territory (
        territory_id, name, country_region_code, group_name,
        sales_ytd, sales_last_year, cost_ytd, cost_last_year, modified_date
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)

  # ---------------------------------------------------------------------------
  # Sales.SalesPerson -> raw.sales_person
  # ---------------------------------------------------------------------------
  - id: query_source_sales_person
    type: io.kestra.plugin.jdbc.sqlserver.Query
    url: "jdbc:sqlserver://{{ inputs.azure_sql_host }}:1433;databaseName={{ inputs.azure_sql_database }};encrypt=true;trustServerCertificate=true;loginTimeout=30"
    username: "{{ inputs.azure_sql_user }}"
    password: "{{ inputs.azure_sql_password }}"
    fetchType: STORE
    sql: |
      SELECT BusinessEntityID, TerritoryID, SalesQuota, Bonus, CommissionPct,
             SalesYTD, SalesLastYear, ModifiedDate
      FROM Sales.SalesPerson

  - id: insert_into_sales_person
    type: io.kestra.plugin.jdbc.postgresql.Batch
    url: "{{ vars.target_url }}"
    username: postgres
    password: postgres
    from: "{{ outputs.query_source_sales_person.uri }}"
    sql: |
      INSERT INTO raw.sales_person (
        business_entity_id, territory_id, sales_quota, bonus, commission_pct,
        sales_ytd, sales_last_year, modified_date
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?)

  # ---------------------------------------------------------------------------
  # Production.Product -> raw.product
  # ---------------------------------------------------------------------------
  - id: query_source_product
    type: io.kestra.plugin.jdbc.sqlserver.Query
    url: "jdbc:sqlserver://{{ inputs.azure_sql_host }}:1433;databaseName={{ inputs.azure_sql_database }};encrypt=true;trustServerCertificate=true;loginTimeout=30"
    username: "{{ inputs.azure_sql_user }}"
    password: "{{ inputs.azure_sql_password }}"
    fetchType: STORE
    sql: |
      SELECT ProductID, Name, ProductNumber, MakeFlag, FinishedGoodsFlag, Color,
             SafetyStockLevel, ReorderPoint, StandardCost, ListPrice, Size,
             SizeUnitMeasureCode, WeightUnitMeasureCode, Weight, DaysToManufacture,
             ProductLine, Class, Style, ProductSubcategoryID, ProductModelID,
             SellStartDate, SellEndDate, DiscontinuedDate, ModifiedDate
      FROM Production.Product

  - id: insert_into_product
    type: io.kestra.plugin.jdbc.postgresql.Batch
    url: "{{ vars.target_url }}"
    username: postgres
    password: postgres
    from: "{{ outputs.query_source_product.uri }}"
    sql: |
      INSERT INTO raw.product (
        product_id, name, product_number, make_flag, finished_goods_flag, color,
        safety_stock_level, reorder_point, standard_cost, list_price, size,
        size_unit_measure_code, weight_unit_measure_code, weight, days_to_manufacture,
        product_line, class, style, product_subcategory_id, product_model_id,
        sell_start_date, sell_end_date, discontinued_date, modified_date
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

  # ---------------------------------------------------------------------------
  # Production.ProductSubcategory -> raw.product_subcategory
  # ---------------------------------------------------------------------------
  - id: query_source_product_subcategory
    type: io.kestra.plugin.jdbc.sqlserver.Query
    url: "jdbc:sqlserver://{{ inputs.azure_sql_host }}:1433;databaseName={{ inputs.azure_sql_database }};encrypt=true;trustServerCertificate=true;loginTimeout=30"
    username: "{{ inputs.azure_sql_user }}"
    password: "{{ inputs.azure_sql_password }}"
    fetchType: STORE
    sql: |
      SELECT ProductSubcategoryID, ProductCategoryID, Name, ModifiedDate
      FROM Production.ProductSubcategory

  - id: insert_into_product_subcategory
    type: io.kestra.plugin.jdbc.postgresql.Batch
    url: "{{ vars.target_url }}"
    username: postgres
    password: postgres
    from: "{{ outputs.query_source_product_subcategory.uri }}"
    sql: |
      INSERT INTO raw.product_subcategory (
        product_subcategory_id, product_category_id, name, modified_date
      ) VALUES (?, ?, ?, ?)

  # ---------------------------------------------------------------------------
  # Production.ProductCategory -> raw.product_category
  # ---------------------------------------------------------------------------
  - id: query_source_product_category
    type: io.kestra.plugin.jdbc.sqlserver.Query
    url: "jdbc:sqlserver://{{ inputs.azure_sql_host }}:1433;databaseName={{ inputs.azure_sql_database }};encrypt=true;trustServerCertificate=true;loginTimeout=30"
    username: "{{ inputs.azure_sql_user }}"
    password: "{{ inputs.azure_sql_password }}"
    fetchType: STORE
    sql: |
      SELECT ProductCategoryID, Name, ModifiedDate
      FROM Production.ProductCategory

  - id: insert_into_product_category
    type: io.kestra.plugin.jdbc.postgresql.Batch
    url: "{{ vars.target_url }}"
    username: postgres
    password: postgres
    from: "{{ outputs.query_source_product_category.uri }}"
    sql: |
      INSERT INTO raw.product_category (
        product_category_id, name, modified_date
      ) VALUES (?, ?, ?)
