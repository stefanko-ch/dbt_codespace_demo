id: bronze_adventureworks
namespace: workshop
description: |
  Worked example: ingest ONE AdventureWorks table (`Sales.Customer`) from
  Azure SQL into the local Postgres `analytics.raw.customer`. Use this as
  a template to add the remaining 8 tables yourself.

  The flow is self-contained:
    1. prepare_schema -- CREATE the bronze table if it doesn't exist,
       then TRUNCATE so re-runs are clean reloads.
    2. query_source   -- SELECT from Azure SQL, store the result as ION
       in Kestra's internal storage.
    3. insert_into_bronze -- Postgres.Batch reads the ION rows and runs
       a parameterized INSERT row-by-row. No CSV detour.

  Pre-filled inputs let you click "Execute" without typing.

  Tables you still need to add (see the "Your turn" section in
  tutorial/01-bronze-kestra.md for the full list and column projections):
    - Sales.SalesOrderHeader
    - Sales.SalesOrderDetail
    - Person.Person
    - Sales.SalesTerritory
    - Sales.SalesPerson
    - Production.Product
    - Production.ProductSubcategory
    - Production.ProductCategory

inputs:
  - id: azure_sql_host
    type: STRING
    defaults: nonacomp-sql.database.windows.net
  - id: azure_sql_database
    type: STRING
    defaults: AdventureWorks
  - id: azure_sql_user
    type: STRING
    defaults: bia21
  - id: azure_sql_password
    type: STRING
    defaults: this_is_a_very_UNSECURE_Password_123!

variables:
  target_url: "jdbc:postgresql://postgres:5432/analytics"

tasks:
  # Step 1: ensure schema + bronze table exist, then truncate so each run
  # is a clean reload. Idempotent.
  - id: prepare_schema
    type: io.kestra.plugin.jdbc.postgresql.Queries
    url: "{{ vars.target_url }}"
    username: postgres
    password: postgres
    sql: |
      CREATE SCHEMA IF NOT EXISTS raw;

      CREATE TABLE IF NOT EXISTS raw.customer (
        customer_id    INTEGER PRIMARY KEY,
        person_id      INTEGER,
        store_id       INTEGER,
        territory_id   INTEGER,
        account_number TEXT,
        modified_date  TIMESTAMP
      );

      TRUNCATE raw.customer;

  # Step 2: pull the source rows, store as ION in Kestra's internal storage.
  # Column ORDER here must match the placeholder order in the INSERT below,
  # since Postgres.Batch binds positionally.
  - id: query_source
    type: io.kestra.plugin.jdbc.sqlserver.Query
    url: "jdbc:sqlserver://{{ inputs.azure_sql_host }}:1433;databaseName={{ inputs.azure_sql_database }};encrypt=true;trustServerCertificate=true;loginTimeout=30"
    username: "{{ inputs.azure_sql_user }}"
    password: "{{ inputs.azure_sql_password }}"
    fetchType: STORE
    sql: |
      SELECT CustomerID, PersonID, StoreID, TerritoryID, AccountNumber, ModifiedDate
      FROM Sales.Customer

  # Step 3: stream the ION file into Postgres via parameterized INSERT.
  - id: insert_into_bronze
    type: io.kestra.plugin.jdbc.postgresql.Batch
    url: "{{ vars.target_url }}"
    username: postgres
    password: postgres
    from: "{{ outputs.query_source.uri }}"
    sql: |
      INSERT INTO raw.customer (
        customer_id, person_id, store_id, territory_id, account_number, modified_date
      ) VALUES (?, ?, ?, ?, ?, ?)
