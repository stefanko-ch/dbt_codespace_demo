name: dbt-codespace-demo

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: postgres
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Europe/Zurich
      # Tell n8n the public URL it is reached on. Codespaces forwards each
      # port at https://<codespace-name>-<port>.<domain>. CODESPACE_NAME and
      # GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN are injected by Codespaces.
      # Without these, n8n's origin check blocks UI calls (workflow execution,
      # credentials test, etc.) with "Origin header does not match".
      N8N_HOST: ${CODESPACE_NAME}-5678.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${CODESPACE_NAME}-5678.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}
      WEBHOOK_URL: https://${CODESPACE_NAME}-5678.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}/
      # Trust one proxy hop (the Codespaces port-forwarding tunnel). Without
      # this n8n compares the Origin header against the local socket and
      # rejects requests with "Origin header does not match".
      N8N_PROXY_HOPS: "1"
      # Allow workflow expressions to read $env.* (forwards Codespace secrets).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Azure SQL credentials forwarded from Codespace secrets.
      # Reference them in n8n credentials as ={{ $env.AZURE_SQL_HOST }} etc.
      AZURE_SQL_HOST: ${AZURE_SQL_HOST:-}
      AZURE_SQL_DATABASE: ${AZURE_SQL_DATABASE:-}
      AZURE_SQL_USER: ${AZURE_SQL_USER:-}
      AZURE_SQL_PASSWORD: ${AZURE_SQL_PASSWORD:-}
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: postgres
      MB_DB_PASS: postgres
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  n8n-data:
  metabase-data:
